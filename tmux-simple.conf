# tmux-simple.conf
# Plugin-free distillation of tmux.conf/settings.conf/bindings.conf.
# Prefix key is C-t (not the default C-b).

#--- core settings ---
set -g default-terminal "screen-256color"
set -s escape-time 0
set-option -g history-limit 6000
setw -g mode-keys vi          # vi-style keys in copy mode (see below)
set -gq allow-passthrough on
set -g mouse on

unbind C-b
set-option -g prefix C-t
bind-key C-t send-prefix

#--- reload config ---
bind R source ~/.config/tmux/tmux-simple.conf \; display "tmux configuration was sourced!"

#--- pane navigation (prefix + hjkl) ---
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

#--- window / session navigation ---
bind-key C-s switch-client -l   # jump to last active session
bind-key C-w last-window        # jump to last active window
bind-key -r S choose-tree -Zs   # interactive session tree
bind-key -r W choose-tree -Zw   # interactive window tree

#--- pane management ---
bind-key C-o rotate-window      # rotate panes within window
bind-key q kill-pane
bind-key N new-session

# split panes: prefix+s then h/j/k/l (lower-case = split adjacent,
# upper-case = split full window edge)
bind -T sMKB h split-window -c "#{pane_current_path}" -h -b
bind -T sMKB j split-window -c "#{pane_current_path}" -v
bind -T sMKB k split-window -c "#{pane_current_path}" -v -b
bind -T sMKB l split-window -c "#{pane_current_path}" -h
bind -T sMKB H split-window -c "#{pane_current_path}" -h -b -f
bind -T sMKB J split-window -c "#{pane_current_path}" -v    -f
bind -T sMKB K split-window -c "#{pane_current_path}" -v -b -f
bind -T sMKB L split-window -c "#{pane_current_path}" -h    -f
bind s switch-client -T sMKB

# move/swap panes: prefix+m then h/j/k/l, or J/S to join by prompt
bind -T mMKB J command-prompt -p "join pane from:" "join-pane -s '%%'"
bind -T mMKB S command-prompt -p "send pane to:"   "join-pane -t '%%'"
bind -T mMKB h splitw -fhb \; swapp -t ! \; killp -t !
bind -T mMKB l splitw -fh  \; swapp -t ! \; killp -t !
bind -T mMKB j splitw -fv  \; swapp -t ! \; killp -t !
bind -T mMKB k splitw -fvb \; swapp -t ! \; killp -t !
bind m switch-client -T mMKB

# rename: prefix+r then w (window) or s (session)
bind -T rMKB w command-prompt 'rename-window %%'
bind -T rMKB s command-prompt 'rename-session %%'
bind r switch-client -T rMKB

#--- copy mode (vi-style, since mode-keys is vi) ---
# Enter copy mode:      prefix + [
# Movement:             h j k l   (left/down/up/right)
#                       w / b     (word forward/back)
#                       0 / $     (start/end of line)
#                       g / G     (top/bottom of history)
#                       Ctrl-d/u  (half page down/up)
# Search:               ? (backward) / (forward), n / N (repeat)
# Start selection:      v (charwise) or V (linewise) or Ctrl-v (block)
# Copy selection:       y  -> also pipes to X clipboard via xsel (custom, below)
# Cancel / exit:        q or Escape
# Paste last copy:      prefix + ]
bind -T copy-mode-vi y send-keys -X copy-pipe "xsel -i -p && xsel -o -p | xsel -i -b"
